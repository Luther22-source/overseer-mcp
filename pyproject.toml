[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overseer-mcp"
version = "0.1.0"
description = "IDE-as-Boss OpenRouter worker pool MCP server over stdio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "openrouter", "llm", "agents", "coding-assistant", "ide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "mcp>=2.0,<3.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Luther22-source/overseer-mcp"
Repository = "https://github.com/Luther22-source/overseer-mcp"
Issues = "https://github.com/Luther22-source/overseer-mcp/issues"

[project.scripts]
overseer = "overseer.server:main"
overseer-mcp = "overseer.server:main"

[tool.setuptools.packages.find]
include = ["overseer*"]

[tool.setuptools.package-data]
overseer = ["ui/dist/app.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
