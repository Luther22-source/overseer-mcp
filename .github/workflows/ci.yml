name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Compile check
        run: python -m compileall -q overseer tests

      - name: Ruff lint
        run: ruff check --isolated --select E9,F63,F7,F82,F,I overseer

      - name: Pytest
        run: pytest -v

      - name: Install UI dependencies
        run: npm --prefix overseer/ui ci

      - name: UI TypeScript typecheck
        run: npm --prefix overseer/ui run typecheck

      - name: UI unit tests
        run: npm --prefix overseer/ui test
